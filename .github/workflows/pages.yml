name: Pages

# Builds and deploys legal.lktec.org from main. Replaces GitHub's built-in "Deploy from a branch"
# build (its internal workflow still ran actions/upload-artifact@v4 on Node 20). The site is
# published only if scripts/check.py passes, so a page with a broken link, a missing favicon,
# an external resource or an open-point marker can never go live, not even by a direct push.
# Only the public files are copied into the artifact (no scripts, README or workflows).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'lukislp/legal'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check pages (language, links, favicon, no external resources, no open points)
        run: python3 scripts/check.py
      - name: Assemble the public files
        run: |
          mkdir _site
          cp -R index.html 404.html robots.txt sitemap.xml favicon.ico CNAME .nojekyll assets en mowdeck studyatrium studylife _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
